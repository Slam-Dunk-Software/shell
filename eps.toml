[package]
name        = "webterm"
version     = "0.1.0"
description = "Web terminal with command palette — access your machine from any browser."
authors     = ["nickagliano"]
license     = "MIT"
repository  = "https://github.com/Slam-Dunk-Software/webterm"
platform    = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]

[system-dependencies]
brew = ["node", "tmux"]
apt  = ["nodejs", "tmux"]

[service]
enabled      = true
start        = "HOST=$(tailscale ip -4) node server.js"
port         = 4444
health_check = "GET /health"
